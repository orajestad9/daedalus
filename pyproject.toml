[project]
name = "daedalus"
version = "0.1.0"
description = "A local-first Python multi-agent orchestration platform for observable, human-approved AI pipelines."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
]

[project.scripts]
daedalus = "daedalus.cli:main"

[project.optional-dependencies]
dev = [
    "types-PyYAML",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
